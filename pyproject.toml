[project]
name = "money-story"
version = "0.1.0"
description = "Personal spending portfolio site — data story + interactive exploration"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "faker>=25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
